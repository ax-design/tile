<!doctype html>
<html><head><meta charset="utf-8"><title>tile browser test</title>
<style>
  body { margin: 0; padding: 20px; font: 16px sans-serif; }
  ax-tile { display: block; width: 200px; height: 100px; margin: 0 0 20px; }
  /* Content above the action must be positioned above it to take the pointer. */
  .above { position: relative; z-index: 2; }
</style></head>
<body>
<button id="tab-start">Start</button>
<ax-tile id="link" layers="fill reveal"><a slot="action" href="#target">Name</a></ax-tile>
<form id="form"><ax-tile id="form-tile" layers="fill reveal"><button slot="action" type="submit">Send</button></ax-tile></form>
<ax-tile id="blank" layers="fill reveal"><a slot="action" href="about:blank" target="_blank">Blank</a></ax-tile>
<ax-tile id="immediate" activation="immediate" layers="fill reveal"><a slot="action" href="#immediate-target">Now</a></ax-tile>
<ax-tile id="capped" layers="fill reveal" style="--ax-tile-activation-delay-max: 50ms; --reveal-press-animation-speed: 8000"><a slot="action" href="#capped-target">Capped</a></ax-tile>
<ax-tile id="plain" layers="fill"><a slot="action" href="#plain-target">Plain</a></ax-tile>
<ax-tile id="modifiers" layers="fill reveal"><a slot="action" href="about:blank" target="_blank">Modifiers</a></ax-tile>
<ax-tile id="taken" layers="fill reveal"><a slot="action" href="#taken-target">Taken</a></ax-tile>
<ax-tile id="extra" layers="fill reveal"><button id="extra-btn" class="above">Extra</button><a slot="action" href="#extra-target">Open</a></ax-tile>
<ax-tile id="static" layers="fill reveal"><span>Static</span></ax-tile>
<ax-tile id="overlay" layers="fill"><ax-surface id="overlay-light" layers="reveal" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%"></ax-surface><a slot="action" href="#overlay-target">Overlay</a></ax-tile>
<ax-tile id="hidden" label="hidden" layers="fill"><a id="hidden-a" slot="action" href="#hidden-target">Hidden name</a></ax-tile>
<style>/* A page that sizes its links: label="hidden" must still win. */ #hidden-styled-a { font-size: 16px; line-height: 20px; }</style>
<ax-tile id="hidden-styled" label="hidden" layers="fill"><a id="hidden-styled-a" slot="action" href="#hidden-styled-target">Styled name</a></ax-tile>
<ax-tile id="focus" layers="fill reveal"><a id="focus-a" slot="action" href="#focus-target">Focus</a></ax-tile>
<style>/* A page-wide focus outline, as many pages have. */ #focus-styled-a:focus { outline: 3px solid red; }</style>
<ax-tile id="focus-styled" layers="fill"><a id="focus-styled-a" slot="action" href="#focus-styled-target">Styled focus</a></ax-tile>
<ax-tile id="native" focus-ring="native" layers="fill"><a id="native-a" slot="action" href="#native-target">Native</a></ax-tile>
<ax-tile id="keys-link" layers="fill reveal"><a id="keys-link-a" slot="action" href="#keys-link-target">Link</a></ax-tile>
<ax-tile id="launch" layers="fill reveal" style="--ax-tile-launch: flip; --ax-fill-color: rgb(0, 120, 215)"><a slot="action" href="#launched">Launch</a><template slot="splash"><span id="splash-mark">Logo</span></template></ax-tile>
<ax-tile id="launch-button" layers="fill reveal" style="--ax-tile-launch: flip; --ax-fill-color: rgb(0, 120, 215)"><button id="launch-btn" slot="action" type="button">Go</button></ax-tile>
<ax-tile id="launch-hold" layers="fill reveal" style="--ax-tile-launch: flip; --ax-fill-color: rgb(0, 120, 215)"><a slot="action" href="#launch-hold-target">Hold</a></ax-tile>
<ax-tile id="launch-forever" layers="fill reveal" style="--ax-tile-launch: flip; --ax-fill-color: rgb(0, 120, 215); --ax-tile-splash-timeout: none"><a slot="action" href="#launch-forever-target">Forever</a></ax-tile>
<ax-tile id="launch-huge" layers="fill reveal" style="--ax-tile-launch: flip; --ax-fill-color: rgb(0, 120, 215); --ax-tile-splash-timeout: 3000000s"><a slot="action" href="#launch-huge-target">Huge</a></ax-tile>
<ax-tile id="launch-timeout" layers="fill reveal" style="--ax-tile-launch: flip; --ax-fill-color: rgb(0, 120, 215); --ax-tile-splash-timeout: 200ms"><a slot="action" href="#launch-timeout-target">Timeout</a></ax-tile>
<ax-tile id="launch-cancel" layers="fill reveal" style="--ax-tile-launch: flip; --ax-fill-color: rgb(0, 120, 215)"><a slot="action" href="#launch-cancel-target">Cancel</a></ax-tile>
<ax-tile id="launch-nopf" layers="fill reveal" style="--ax-tile-launch: flip; --ax-fill-color: rgb(0, 120, 215)"><a slot="action" href="#launch-nopf-target">No prefetch</a></ax-tile>
<ax-tile id="launch-restore" layers="fill reveal" style="--ax-tile-launch: flip; --ax-fill-color: rgb(0, 120, 215)"><a slot="action" href="#launch-restore-target">Restore</a></ax-tile>
<ax-tile id="launch-modifiers" layers="fill reveal" style="--ax-tile-launch: flip; --ax-fill-color: rgb(0, 120, 215)"><a slot="action" href="about:blank" target="_blank">Modifiers</a></ax-tile>
<ax-tile id="normal-tile" layers="fill reveal"><a slot="action" href="#normal-target">Normal</a></ax-tile>
<ax-tile id="launch-nav" layers="fill reveal" style="--ax-tile-launch: flip; --ax-fill-color: rgb(0, 120, 215)"><a slot="action" href="/next.html">Next page</a></ax-tile>
<ax-tile id="launch-204" layers="fill reveal" style="--ax-tile-launch: flip; --ax-fill-color: rgb(0, 120, 215); --ax-tile-splash-timeout: 400ms"><a slot="action" href="/nothing">No content</a></ax-tile>
<ax-tile id="launch-router" layers="fill reveal" style="--ax-tile-launch: flip; --ax-fill-color: rgb(0, 120, 215)"><a slot="action" href="/next.html">Router</a></ax-tile>
<ax-tile id="launch-dark" layers="fill reveal" style="--ax-tile-launch: flip"><a slot="action" href="#launch-dark-target">Dark</a></ax-tile>
<script type="module" src="./page.ts"></script>
</body></html>
